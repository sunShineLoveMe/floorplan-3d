<!doctype html><html lang="en"><meta charset="utf-8"><title>T09 canvas control</title><button id="download">Download opaque canvas control</button><p id="status">Opaque background and text, no app modules.</p><script>
document.querySelector('#download').onclick=()=>{const c=document.createElement('canvas');c.width=800;c.height=600;const x=c.getContext('2d');x.fillStyle='#f7f4ee';x.fillRect(0,0,800,600);x.fillStyle='#222';x.font='32px Arial';x.fillText('T09 opaque canvas control',50,100);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='T09-Safari-opaque-control.png';a.click();document.querySelector('#status').textContent='Download started';});};
</script></html>
